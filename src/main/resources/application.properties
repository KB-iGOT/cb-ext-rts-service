server.port=${PORT:8080}
spring.application.name=cb-ext-rts-service
logging.level.root=INFO

# Shown in /stats, SESSION_STATE, PARTICIPANT_JOINED and log lines. Kubernetes sets HOSTNAME to the pod name,
# so no deployment change is needed; POD_NAME overrides it (e.g. two local instances).
pod.name=${POD_NAME:${HOSTNAME:local-1}}

rts.ws.path=/ws
rts.ws.max-frame-payload=65536
# The server pings every socket; a socket with no inbound frame (pong included) for idle-timeout is closed as lost.
rts.ws.ping-interval=20s
rts.ws.idle-timeout=50s
# Frames queued per socket before the client is treated as too slow and dropped (close 1008).
rts.ws.send-queue=256
# One log line per connect/disconnect (always on for legacy room= clients). Keep off for capacity runs.
rts.ws.log-connections=true

rts.room.max-participants=200
# true: the session is created and goes LIVE when the PC connects. false: the PC must send START_SESSION.
# Learners who connect before the PC wait (SESSION_STATE WAITING) either way.
rts.room.start-on-pc-join=true
# PC network loss: the survey pauses and ends after this wait. 0s = never end on its own.
rts.room.pc-wait-timeout=5m
rts.room.live-stats-interval=1s
rts.room.delivery-report-delay=2s
rts.room.max-text-chars=500

# Who is connecting (LLD §3, §8). pass (default): the client calls POST /rts/v1/join with its access token, the
# server decides the role from the session roster and returns a single-use join pass; the socket opens with
# /ws?pass=... (a missing, used or expired pass: ERROR UNAUTHORIZED, close 4401). Every connection, reconnects to
# the same live survey included, uses a new pass.
# dev: identity taken from the URL with no checks (?rtsCode=&userId=&role=): local and load tests only, never in
# an environment people use.
rts.auth.mode=${RTS_AUTH_MODE:pass}
# How POST /rts/v1/join checks the caller: jwt = Keycloak access token (set the public key or JWKS URL below);
# demo = "Authorization: Bearer demo:<userId>", trusts anyone (laptop demo only).
rts.auth.identity=${RTS_AUTH_IDENTITY:jwt}
# Keycloak realm key, first found wins. Same settings as the other iGOT services (cb-ext-assessment-service ...):
#   accesstoken.publickey.basepath: folder with one key file per realm key, named by its kid (/keys/ in iGOT,
#     mounted from core_vault_sunbird_sso_publickey); the token's kid picks the key
#   RTS_AUTH_JWT_PUBLIC_KEY, else KEYCLOAK_PUBLIC_KEY (shared iGOT env): one key
#   RTS_AUTH_JWT_JWKS_URI: the realm's certs URL
rts.auth.jwt.keys-dir=${accesstoken.publickey.basepath:}
rts.auth.jwt.public-key=${RTS_AUTH_JWT_PUBLIC_KEY:${KEYCLOAK_PUBLIC_KEY:}}
rts.auth.jwt.jwks-uri=${RTS_AUTH_JWT_JWKS_URI:}
# Expected iss: RTS_AUTH_JWT_ISSUER if set, else sso.url + "realms/" + sso.realm (as the other iGOT services check it),
# else not checked
rts.auth.jwt.issuer=${RTS_AUTH_JWT_ISSUER:}
rts.auth.jwt.sso-url=${sso.url:}
rts.auth.jwt.sso-realm=${sso.realm:}
# Everything about the user comes from the token, nothing from the request: userId = sub (after the last ':'),
# name = name (else preferred_username), role = COORDINATOR if the roles at role-claim include one of
# coordinator-roles, else PARTICIPANT. The coordinator must also be the PC of the survey (roster).
# TO CONFIRM with a real iGOT token: where it keeps roles, and the Program Coordinator role's name.
rts.auth.jwt.role-claim=${RTS_AUTH_JWT_ROLE_CLAIM:realm_access.roles}
rts.auth.jwt.coordinator-roles=${RTS_AUTH_JWT_COORDINATOR_ROLES:PROGRAM_COORDINATOR}
rts.auth.pass-ttl=60s
# PUT /admin/sessions/{code} (who is PC, who may join) needs this in X-Admin-Key; empty = endpoint off
rts.auth.admin-key=${RTS_AUTH_ADMIN_KEY:}
# Demo only: a code with no roster: first user asking to be PC becomes its PC, anyone may join as a learner
rts.auth.dev-claim-coordinator=${RTS_AUTH_DEV_CLAIM_COORDINATOR:false}
# Browser origins allowed to open the socket, comma separated (empty = any)
rts.auth.allowed-origins=${RTS_AUTH_ALLOWED_ORIGINS:}

# Window for the per-second rates in GET /stats (always computed).
rts.stats.log-interval=10s
# Also print a STATS line in the log every window. Off by default; turn on for a load test with RTS_STATS_LOG=true.
rts.stats.log-enabled=${RTS_STATS_LOG:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Survey state lives in Redis, shared by all pods: any pod serves anyone, and a pod restart does not lose a survey.
# Needs a Redis address (see spring.data.redis.* below). The pod does not start if Redis is unreachable
# ("Unable to connect to Redis" in the log); if Redis drops later, joins and answers reply TRY_AGAIN.
# Redis key lifetime while a survey runs, and after it ends
rts.room.ttl=12h
rts.room.ttl-after-end=1h
# Crashed pod clean-up: every pod heartbeats; a pod silent for dead-after is treated as crashed and
# another pod runs "left" for its sockets (PC told, survey paused if it held the PC). The same check ends paused
# surveys whose PC wait ran out even if the pod that paused them is gone. Keep dead-after well above heartbeat.
rts.pod.heartbeat=5s
rts.pod.dead-after=20s
# Redis address: REDIS_* if set (docker-compose, local runs), else IGOT_REDIS_* (in the iGOT ConfigMap from the
# shared ui-shared-env.j2), else localhost. Password: REDIS_PASSWORD, empty if not set.
spring.data.redis.host=${REDIS_HOST:${IGOT_REDIS_HOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${IGOT_REDIS_PORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
# Kept out of /actuator/health so a Redis outage does not make Kubernetes restart every pod (sockets stay open;
# joins and answers reply TRY_AGAIN until Redis is back)
management.health.redis.enabled=false
